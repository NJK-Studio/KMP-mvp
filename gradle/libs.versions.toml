[versions]
agp = "8.2.2"
android-compileSdk = "34"
android-minSdk = "24"
android-targetSdk = "34"
# kotlin
kotlin = "2.1.10"
ksp = "2.1.10-1.0.31"
kotlinxDatetime = "0.6.0"
kotlinxSerializationJson = "1.8.1"
# androidx
androidx-activityCompose = "1.10.1"
androidx-lifecycle = "2.8.4"
